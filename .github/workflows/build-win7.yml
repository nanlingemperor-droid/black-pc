name: build-win7
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset win32-win7
        working-directory: loader
      - name: Build
        run: cmake --build build/win32-win7 --config RelWithDebInfo
        working-directory: loader
      - uses: actions/upload-artifact@v4
        with:
          name: black-win7
          path: |
            loader/build/win32-win7/RelWithDebInfo/black.exe
            loader/build/win32-win7/RelWithDebInfo/blackrt.dll
